name: dinerito
description: App para gestionar prestamos.

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dartz: ^0.10.1
  flutter_localizations:
    sdk: flutter
  google_fonts: 6.1.0
  flutter_secure_storage: ^9.0.0
  dio: ^5.0.0
  envied: ^0.5.2
  email_validator: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  envied_generator: ^0.5.2
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
